<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Driving supervisor</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");

html{
    font-size: 16px; 
    font-family: Montserrat;
    font-weight: 400;
    height: 100%;
    margin: 0;
}

body{
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    min-height: 100vh;
    color: rgb(00, 00, 00);
    background-color: rgb(250, 250, 250);
    height: 100%;
    margin: 0;
}

header{
    box-sizing: border-box;
    min-height: 3rem;
    gap: 0.5rem;
    margin-bottom: 15px;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
    width: 100%;
    height: 3rem;
}

#drivingInfosZone{
    display: flex;
    flex-direction: row;
    justify-content: space-between; 
    align-items: center;
    padding: 0.5rem;
    width: 100%;
    height: 3rem;
    box-sizing: border-box;
}

#leftGroup{
    display: flex;
    flex-direction: row;
    justify-content: auto;
    align-items: center;
    gap: 1rem;
    padding: 0;
    width: auto;
    height: 3rem;
    box-sizing: border-box;
}

#driveSelector{
    display: flex;
    flex-direction: row;
    justify-content: auto;
    align-items: center;
    gap: 0.25rem;
    padding: 0;
    width: auto;
    color: rgb(150, 150, 150);
}

#park{
    color: black;
}

#bottomBorder{
    width: 95%;
    border-bottom: 2px solid rgb(200, 200, 200);
    margin: 0 auto;
}

#speedDisplay{
    font-weight: bold;
    color: rgb(150, 150, 150);
}

#speedValue{
    font-size: 24px;
}

main{
    display: flex;
    flex: 1;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    gap: 0.5rem;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
    width: 100%;
}

#lightsZone{
    display: flex;
    flex-direction: column;
    justify-content: auto;
    align-items: center;
    box-sizing: border-box;
    gap: 0.5rem;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
    width: 10%;
    height: 100%;
}

.light{
    height: 30px;
    width: 30px;
}

#parkingLight{
    height: 35px;
    width: 35px;
}

#adasZone {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    width: 90%;
    gap: 10rem;
}

.adasOverlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    height: 200px;
    width: 200px;
}


footer{
    box-sizing: border-box;
    min-height: 3rem;
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 0px;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
    width: 100%;
    height: 70px;
}

#alertBox{
    width: auto;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    gap: 1rem;
    padding: 0 1rem;
    color: white;
    font-size: 14px;
    background-color: black;
    border-radius: 100px;
}

#alertPicture{
    height: 20px;
    width: 20px;
}
    </style>
</head>

<body>
    <header>
        <div class="container" id="drivingInfosZone">
            <div class="container" id="leftGroup">
                <div id="driveSelector">
                    <span id="park">P</span>
                    <span id="reverse">R</span>
                    <span id="neutral">N</span>
                    <span id="drive">D</span></div>
                <p id="ADASState">{ADAS State}</p>
            </div>
            <p id="speedDisplay"><span id="speedValue">00</span> km/h</p>
        </div>
        <div id="bottomBorder"></div>
    </header>

    <main>
        <aside class="container" id="lightsZone">
            <img class="light" id="lowBeams" src="sources/images/lights/low_beams.png">
            <img class="light" id="highBeams" src="sources/images/lights/auto_high_beams.png">
            <img class="light" id="parkingLight" src="sources/images/lights/parking_brake.png">
        </aside>
        <section class="container" id="adasZone">
                <img class="light" id="leftBlinker" src ="sources/images/lights/left_blinker.png">
                <img class="adasOverlay" id="adasVisualisation" src="sources/images/adas/no_adas.png">
                <img class="adasOverlay" id="carVisualisation" src="sources/images/adas/3rd_person_view_car.png">
                <img class="light" id="rightBlinker" src ="sources/images/lights/right_blinker.png">
        </section>
    </main>

    <footer>
        <div id="alertBox">
            <img id="alertPicture" src="sources/images/lights/notification_no_padding.png">
            <p id="alertMessage">{Alert}</p>
        </div>
    </footer>
    <script>
        // Récupération de références vers les éléments de l'interface
        const alertText = document.getElementById("alertMessage");

        // Données
        geoDatas = {
        loc: {lat: null, lon: null, acc: null},
        orientation: null,
        speed: null
        };

        // Traitement
        geoObserver = navigator.geolocation.watchPosition(
        (position) => {
            alertText.innerText = 'Nouvelles données reçues';
            geoDatas.loc = {
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            acc: position.coords.accuracy,
            },
            geoDatas.speed = position.coords.speed;
            geoDatas.orientation = position.coords.heading;
        },
        (err) => {
            alertText.innerText = 'Erreurs dans la récupération des données' + err.message;
        }
        );
    </script>
</body>
</html>
